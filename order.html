<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Canteen - Place Order</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    padding: 30px 15px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 10% 15%, #ffd6e7 0%, transparent 30%),
        radial-gradient(circle at 90% 10%, #c9f2ff 0%, transparent 30%),
        radial-gradient(circle at 15% 90%, #fff0b8 0%, transparent 30%),
        radial-gradient(circle at 90% 85%, #ddd0ff 0%, transparent 30%),
        linear-gradient(135deg, #fff5f8, #eefaff, #fffbea);
}

.order-box {
    width: 100%;

    max-width: 650px;

    padding: 35px;

    background: rgba(255,255,255,0.92);

    border-radius: 28px;

    box-shadow:
        0 15px 40px rgba(70,50,90,0.18);

    backdrop-filter: blur(10px);
}

h1 {
    text-align: center;

    margin: 0 0 10px;

    font-size: 36px;

    color: #30243a;
}

.welcome {
    text-align: center;

    color: #766c7d;

    margin-bottom: 25px;
}

.section {
    padding: 20px;

    margin-bottom: 18px;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #f8f4ff
        );

    border: 1px solid #eee7f7;
}

.section h2 {
    margin: 0 0 15px;

    color: #352641;

    font-size: 21px;
}

.item {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 12px 0;

    border-bottom: 1px solid #eee;
}

.item:last-child {
    border-bottom: none;
}

.item-name {
    color: #55495d;

    font-weight: bold;
}

.item-price {
    color: #d35432;

    font-weight: bold;
}

.total {
    display: flex;

    justify-content: space-between;

    padding: 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #fff4c7,
            #ffe9d6
        );

    font-size: 24px;

    font-weight: bold;

    color: #30243a;
}

.place-btn {
    width: 100%;

    margin-top: 20px;

    border: none;

    padding: 16px;

    border-radius: 30px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #ff7b54,
            #e5483f
        );

    box-shadow:
        0 8px 20px rgba(229,72,63,0.28);
}

.back {
    display: block;

    margin-top: 20px;

    text-align: center;

    color: #635773;

    text-decoration: none;

    font-weight: bold;
}

.empty {
    text-align: center;

    color: #777;

    padding: 20px;
}

@media (max-width: 600px) {

    .order-box {
        padding: 25px 18px;
    }

    h1 {
        font-size: 29px;
    }

    .total {
        font-size: 20px;
    }
}

</style>

</head>

<body>

<div class="order-box">

<h1>🎫 Confirm Order</h1>

<p class="welcome">
    Hello,
    <strong id="studentName">Student</strong>! 👋
</p>

<div class="section">

    <h2>🍽️ Your Order</h2>

    <div id="orderItems"></div>

</div>

<div class="total">

    <span>Total</span>

    <span>
        ₹<span id="total">0</span>
    </span>

</div>

<button
    class="place-btn"
    onclick="confirmOrder()">

    ✅ Confirm & Place Order

</button>

<a
    href="cart.html"
    class="back">

    ← Back to Cart

</a>

</div>

<script>

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


let studentName =
    localStorage.getItem("studentName") ||
    "Student";


document.getElementById("studentName").innerText =
    studentName;


function displayOrder() {

    let orderItems =
        document.getElementById("orderItems");

    let totalElement =
        document.getElementById("total");

    orderItems.innerHTML = "";

    let total = 0;


    if (cart.length === 0) {

        orderItems.innerHTML =
            '<p class="empty">Your cart is empty.</p>';

        totalElement.innerText = 0;

        return;
    }


    cart.forEach(function(item) {

        let quantity =
            item.quantity || 1;

        let itemTotal =
            Number(item.price) * quantity;

        total += itemTotal;


        orderItems.innerHTML += `

            <div class="item">

                <span class="item-name">
                    ${item.name} × ${quantity}
                </span>

                <span class="item-price">
                    ₹${itemTotal}
                </span>

            </div>

        `;

    });


    totalElement.innerText = total;

}


function confirmOrder() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        window.location.href =
            "menu.html";

        return;
    }


    let total = 0;


    cart.forEach(function(item) {

        total +=
            Number(item.price) *
            (item.quantity || 1);

    });


    /*
       TOKEN NUMBER
       First order = 101
       Second order = 102
       Third order = 103
    */

    let lastToken =
        Number(
            localStorage.getItem(
                "lastTokenNumber"
            )
        ) || 100;


    let tokenNumber =
        lastToken + 1;


    localStorage.setItem(
        "lastTokenNumber",
        tokenNumber
    );


    let orderHistory =
        JSON.parse(
            localStorage.getItem(
                "orderHistory"
            )
        ) || [];


    let order = {

        tokenNumber:
            tokenNumber,

        orderId:
            "ORD" + Date.now(),

        student:
            studentName,

        items:
            JSON.parse(
                JSON.stringify(cart)
            ),

        total:
            total,

        date:
            new Date().toLocaleString(),

        status:
            "Placed"

    };


    orderHistory.push(order);


    localStorage.setItem(
        "orderHistory",
        JSON.stringify(orderHistory)
    );


    /*
       VERY IMPORTANT:
       Order successful ayyaka
       current cart complete ga clear
    */

    localStorage.removeItem("cart");


    alert(
        "🎉 Order placed successfully!\n\nYour Token Number is: " +
        tokenNumber
    );


    window.location.href =
        "order-history.html";

}


displayOrder();

</script>

</body>
</html>
