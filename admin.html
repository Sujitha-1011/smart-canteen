<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Canteen - Admin Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 10% 15%, #ffd6e7 0%, transparent 30%),
        radial-gradient(circle at 90% 10%, #c9f2ff 0%, transparent 30%),
        radial-gradient(circle at 15% 90%, #fff0b8 0%, transparent 30%),
        radial-gradient(circle at 90% 85%, #ddd0ff 0%, transparent 30%),
        linear-gradient(135deg, #fff5f8, #eefaff, #fffbea);

    color: #30243a;
}


/* HEADER */

header {
    background:
        linear-gradient(
            135deg,
            #8068d8,
            #5b48a8
        );

    color: white;

    padding: 22px 30px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    box-shadow:
        0 5px 20px rgba(70,50,90,0.15);
}

header h1 {
    margin: 0;

    font-size: 28px;
}

.logout-btn {
    border: none;

    background: white;

    color: #5b48a8;

    padding: 11px 18px;

    border-radius: 22px;

    font-weight: bold;

    cursor: pointer;
}


/* MAIN */

.container {
    max-width: 1200px;

    margin: 30px auto;

    padding: 0 20px;
}

.welcome {
    text-align: center;

    margin-bottom: 30px;
}

.welcome h2 {
    margin-bottom: 8px;

    font-size: 30px;
}

.welcome p {
    color: #766c7d;
}


/* STATISTICS */

.stats {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 15px;

    margin-bottom: 30px;
}

.stat-card {
    background: white;

    padding: 20px;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(70,50,90,0.10);
}

.stat-icon {
    font-size: 35px;
}

.stat-card h3 {
    margin: 8px 0 5px;

    color: #766c7d;

    font-size: 14px;
}

.stat-number {
    font-size: 25px;

    font-weight: bold;

    color: #5b48a8;
}


/* ORDERS */

.orders-box {
    background: white;

    border-radius: 22px;

    padding: 25px;

    box-shadow:
        0 10px 30px rgba(70,50,90,0.10);
}

.orders-box h2 {
    margin-top: 0;

    color: #352641;
}


/* ORDER CARD */

.order-card {
    border: 1px solid #eee7f2;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 18px;

    background: #fff;
}

.order-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.token {
    background: #f4f0ff;

    color: #5b48a8;

    padding: 8px 14px;

    border-radius: 20px;

    font-weight: bold;
}

.status {
    padding: 7px 13px;

    border-radius: 18px;

    font-size: 13px;

    font-weight: bold;
}


/* STATUS */

.status.pending {
    background: #fff0c2;

    color: #9a6b00;
}

.status.preparing {
    background: #dcecff;

    color: #28629b;
}

.status.ready {
    background: #d9f7e8;

    color: #18864b;
}

.status.completed {
    background: #dbeafe;

    color: #2563a6;
}


/* INFO */

.order-info {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-bottom: 15px;
}

.order-info p {
    margin: 4px 0;

    color: #55495d;
}


/* ITEMS */

.items {
    background: #f8f4ff;

    border-radius: 14px;

    padding: 12px 15px;

    margin-bottom: 15px;
}

.items strong {
    color: #352641;
}

.item-row {
    display: flex;

    justify-content: space-between;

    padding: 6px 0;

    border-bottom:
        1px solid #eee7f2;
}

.item-row:last-child {
    border-bottom: none;
}


/* TOTAL */

.total {
    font-size: 20px;

    font-weight: bold;

    color: #d35432;

    text-align: right;

    margin-bottom: 15px;
}


/* BUTTONS */

.action-buttons {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}

.action-buttons button {
    border: none;

    padding: 10px 16px;

    border-radius: 20px;

    font-weight: bold;

    cursor: pointer;
}

.preparing-btn {
    background: #dcecff;

    color: #28629b;
}

.ready-btn {
    background: #d9f7e8;

    color: #18864b;
}

.complete-btn {
    background: #dbeafe;

    color: #2563a6;
}

.delete-btn {
    background: #ffe0e0;

    color: #c0392b;
}


/* EMPTY */

.empty {
    text-align: center;

    padding: 40px 20px;

    color: #777;
}


/* RESPONSIVE */

@media (max-width: 1000px) {

    .stats {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media (max-width: 800px) {

    .stats {
        grid-template-columns:
            1fr 1fr;
    }

    .order-info {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 550px) {

    header {
        padding: 18px;
    }

    header h1 {
        font-size: 21px;
    }

    .orders-box {
        padding: 18px;
    }

    .order-header {
        flex-direction: column;

        align-items: flex-start;

        gap: 10px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        👨‍💼 Smart Canteen Admin
    </h1>

    <button
        class="logout-btn"
        onclick="adminLogout()">

        🚪 Logout

    </button>

</header>


<div class="container">


    <div class="welcome">

        <h2>
            📊 Admin Dashboard
        </h2>

        <p>
            Manage student orders and monitor canteen activity.
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="stats">


        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <h3>
                Total Orders
            </h3>

            <div
                class="stat-number"
                id="totalOrders">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ⏳
            </div>

            <h3>
                Pending Orders
            </h3>

            <div
                class="stat-number"
                id="pendingOrders">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ✅
            </div>

            <h3>
                Completed Orders
            </h3>

            <div
                class="stat-number"
                id="completedOrders">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📅
            </div>

            <h3>
                Today's Orders
            </h3>

            <div
                class="stat-number"
                id="todayOrders">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <h3>
                Total Revenue
            </h3>

            <div class="stat-number">

                ₹<span id="totalRevenue">
                    0
                </span>

            </div>

        </div>


    </div>


    <!-- ORDERS -->

    <div class="orders-box">

        <h2>
            📦 All Student Orders
        </h2>

        <div id="ordersContainer"></div>

    </div>


</div>


<script>


/* =========================================
   ADMIN LOGIN CHECK
========================================= */

if (
    localStorage.getItem(
        "adminLoggedIn"
    ) !== "true"
) {

    window.location.href =
        "admin-login.html";

}


/* =========================================
   GET ORDERS
========================================= */

function getOrders() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "orderHistory"
            )
        ) || [];

    } catch (error) {

        return [];

    }

}


/* =========================================
   DISPLAY ORDERS
========================================= */

function displayOrders() {


    let orders =
        getOrders();


    let container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML = "";


    /* =================================
       STATISTICS
    ================================= */

    let pending = 0;

    let completed = 0;

    let today = 0;

    let revenue = 0;


    let currentDate =
        new Date()
        .toLocaleDateString();


    orders.forEach(
        function(order) {


        /* PENDING */

        if (
            order.status !==
            "Completed"
        ) {

            pending++;

        }


        /* COMPLETED */

        if (
            order.status ===
            "Completed"
        ) {

            completed++;

        }


        /* REVENUE */

        revenue +=
            Number(order.total) || 0;


        /* TODAY */

        if (order.date) {

            let orderDate =
                new Date(
                    order.date
                ).toLocaleDateString();


            if (
                orderDate ===
                currentDate
            ) {

                today++;

            }

        }

    });


    document.getElementById(
        "totalOrders"
    ).innerText =
        orders.length;


    document.getElementById(
        "pendingOrders"
    ).innerText =
        pending;


    document.getElementById(
        "completedOrders"
    ).innerText =
        completed;


    document.getElementById(
        "todayOrders"
    ).innerText =
        today;


    document.getElementById(
        "totalRevenue"
    ).innerText =
        revenue;


    /* =================================
       NO ORDERS
    ================================= */

    if (orders.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div style="font-size:50px;">
                    📭
                </div>

                <h3>
                    No Orders Yet
                </h3>

                <p>
                    Student orders will appear here.
                </p>

            </div>

        `;

        return;

    }


    /* =================================
       NEWEST FIRST
    ================================= */

    orders
        .slice()
        .reverse()
        .forEach(
            function(order) {


        /* =================================
           STATUS CLASS
        ================================= */

        let status =
            order.status ||
            "Pending";


        let statusClass =
            status
            .toLowerCase()
            .replace(
                /\s+/g,
                "-"
            );


        /* =================================
           ITEMS
        ================================= */

        let itemsHTML = "";


        if (
            order.items &&
            Array.isArray(
                order.items
            )
        ) {


            order.items.forEach(
                function(item) {


                let quantity =
                    Number(
                        item.quantity
                    ) || 1;


                let price =
                    Number(
                        item.price
                    ) || 0;


                let itemTotal =
                    price * quantity;


                itemsHTML += `

                    <div class="item-row">

                        <span>

                            ${escapeHTML(
                                item.name
                            )}

                            × ${quantity}

                        </span>

                        <span>

                            ₹${itemTotal}

                        </span>

                    </div>

                `;

            });

        }


        /* =================================
           ACTION BUTTONS
        ================================= */

        let buttonsHTML = "";


        /* PENDING */

        if (
            status === "Pending"
        ) {

            buttonsHTML += `

                <button
                    class="preparing-btn"
                    onclick="updateStatus(
                        '${escapeHTML(
                            order.orderId
                        )}',
                        'Preparing'
                    )">

                    👨‍🍳 Start Preparing

                </button>

            `;

        }


        /* PREPARING */

        if (
            status ===
            "Preparing"
        ) {

            buttonsHTML += `

                <button
                    class="ready-btn"
                    onclick="updateStatus(
                        '${escapeHTML(
                            order.orderId
                        )}',
                        'Ready'
                    )">

                    🎫 Mark Ready

                </button>

            `;

        }


        /* PENDING OR PREPARING OR READY */

        if (
            status === "Pending" ||
            status === "Preparing" ||
            status === "Ready"
        ) {

            buttonsHTML += `

                <button
                    class="complete-btn"
                    onclick="updateStatus(
                        '${escapeHTML(
                            order.orderId
                        )}',
                        'Completed'
                    )">

                    ✅ Complete

                </button>

            `;

        }


        /* DELETE */

        buttonsHTML += `

            <button
                class="delete-btn"
                onclick="deleteOrder(
                    '${escapeHTML(
                        order.orderId
                    )}'
                )">

                🗑️ Delete

            </button>

        `;


        /* =================================
           ORDER CARD
        ================================= */

        container.innerHTML += `

            <div class="order-card">


                <div class="order-header">


                    <span class="token">

                        🎫 Token #
                        ${escapeHTML(
                            order.tokenNumber
                        )}

                    </span>


                    <span
                        class="
                            status
                            ${statusClass}
                        ">

                        ${escapeHTML(
                            status
                        )}

                    </span>


                </div>


                <div class="order-info">


                    <p>

                        👤

                        <strong>
                            Student:
                        </strong>

                        ${escapeHTML(
                            order.student
                        )}

                    </p>


                    <p>

                        🆔

                        <strong>
                            Order ID:
                        </strong>

                        ${escapeHTML(
                            order.orderId
                        )}

                    </p>


                    <p>

                        📅

                        <strong>
                            Date:
                        </strong>

                        ${escapeHTML(
                            order.date
                        )}

                    </p>


                </div>


                <div class="items">


                    <strong>
                        🍽️ Items
                    </strong>


                    ${itemsHTML}


                </div>


                <div class="total">

                    Total:
                    ₹${Number(
                        order.total
                    ) || 0}

                </div>


                <div class="action-buttons">

                    ${buttonsHTML}

                </div>


            </div>

        `;

    });

}


/* =========================================
   UPDATE STATUS
========================================= */

function updateStatus(
    orderId,
    newStatus
) {


    let orders =
        getOrders();


    orders.forEach(
        function(order) {


        if (
            order.orderId ===
            orderId
        ) {

            order.status =
                newStatus;

        }

    });


    localStorage.setItem(
        "orderHistory",
        JSON.stringify(
            orders
        )
    );


    displayOrders();

}


/* =========================================
   DELETE ORDER
========================================= */

function deleteOrder(
    orderId
) {


    let answer =
        confirm(
            "Are you sure you want to delete this order?"
        );


    if (!answer) {

        return;

    }


    let orders =
        getOrders();


    orders =
        orders.filter(
            function(order) {

                return (
                    order.orderId !==
                    orderId
                );

            }
        );


    localStorage.setItem(
        "orderHistory",
        JSON.stringify(
            orders
        )
    );


    displayOrders();

}


/* =========================================
   ADMIN LOGOUT
========================================= */

function adminLogout() {


    localStorage.removeItem(
        "adminLoggedIn"
    );


    window.location.href =
        "admin-login.html";

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================
   FIRST LOAD
========================================= */

displayOrders();


/* =========================================
   AUTO REFRESH ADMIN
========================================= */

setInterval(
    function() {

        displayOrders();

    },
    2000
);


</script>


</body>

</html>
